<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAVA LIFE Journal Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-width white page split in two panes (index left, entry right) on one 12px grid.
   Three text sizes only. Green appears on bands and on whatever is hovered or selected. Single light theme by choice. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --muted:#6f6f6f;
  --hi:#39ff14;
  --glass:rgba(255,255,255,.72);
  --u:12px;            /* the one spacing unit: gutters, gaps, padding */
  --row:32px;          /* height shared by bands and boxes */
  --lg:clamp(22px,2.1vw,30px);
  --md:17px;
  --sm:12px;
  --font:Futura,"Futura PT","Futura Std",Jost,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--md);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;text-transform:inherit;letter-spacing:inherit}
h1,h2,h3,p{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.sm{font-size:var(--sm);letter-spacing:.06em;text-transform:uppercase;line-height:1.3;font-variant-numeric:tabular-nums}
.lg{font-size:var(--lg);line-height:1.15;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}

/* header: logo and search float at the top, no bar */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--u);padding:var(--u)}
.top img{width:clamp(64px,7vw,96px);height:auto}
.search{width:clamp(140px,20vw,260px)}
.search input{width:100%;border:0;border-bottom:1px solid var(--ink);border-radius:0;outline:0;background:transparent;font:inherit;font-size:14px;line-height:1.4;color:var(--ink);padding:6px 0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink);opacity:1}
.search input::-webkit-search-decoration,.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.app{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.pane{overflow-y:auto;padding:0 var(--u) var(--u);display:flex;flex-direction:column;gap:var(--u);min-width:0}
.pane.left{padding-bottom:0}

/* band and box share one height */
.band{display:flex;align-items:center;justify-content:space-between;gap:var(--u);min-height:var(--row);padding:4px 8px;background:var(--hi);flex:none}
.box{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--row);padding:4px 8px;border:1px solid var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);width:100%;transition:background-color .12s}
.box:hover,.box[aria-pressed="true"],.box[aria-current="page"]{background:var(--hi)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--u)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--u)}

.card{border:1px solid var(--ink);padding:var(--u);display:flex;flex-direction:column;gap:var(--u);transition:background-color .12s;min-width:0}
.card:hover,.card[aria-current="true"]{background:var(--hi)}
.card .meta{display:flex;justify-content:space-between;gap:8px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;margin-top:auto}

.rows{list-style:none;margin:0;padding:0;display:grid;gap:var(--u)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:var(--u);align-items:baseline;border:1px solid var(--ink);padding:6px 8px;min-height:var(--row);transition:background-color .12s}
.rows a:hover{background:var(--hi)}

/* bottom nav: boxes float over the index, no bar behind them */
.dock{position:sticky;bottom:0;padding:var(--u) 0;margin-top:auto;z-index:5}

/* entry */
.entry{display:flex;flex-direction:column;gap:var(--u);max-width:760px}
.entry .meta{display:flex;justify-content:space-between;gap:var(--u)}
.body{line-height:1.8;overflow-wrap:anywhere}
.body p{margin:0 0 1.1em}
.body img{margin:var(--u) 0;height:auto}
.body h3,.body h4,.body h6{font-size:var(--md);font-weight:500;margin:1.8em 0 .5em}
.body blockquote{margin:1.1em 0;padding-left:var(--u);border-left:3px solid var(--hi)}
.body a{text-decoration:underline;text-underline-offset:3px}
.body a:hover{background:var(--hi)}
.body figure{margin:var(--u) 0}
.body figcaption{font-size:var(--sm);color:var(--muted)}
.body hr{border:0;border-top:1px solid var(--ink);margin:1.8em 0}
.tablewrap{overflow-x:auto}
.body table{border-collapse:collapse}
.body td{border:1px solid var(--ink);padding:6px 8px;vertical-align:top}
.about{display:grid;gap:var(--u);max-width:62ch}
.about a:hover{background:var(--hi)}
.back{display:none}

@media (max-width:899px){
  html,body{height:auto}
  body{display:block}
  .app{display:block}
  .pane{overflow:visible}
  body.reading .left,body:not(.reading) .right{display:none}
  .back{display:flex}
  .dock{position:fixed;left:var(--u);right:var(--u);bottom:0}
  .pane.left{padding-bottom:72px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dock .grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rows a{grid-template-columns:1fr auto}
  .rows a span:first-child{grid-column:1/-1}
}
@media (max-width:520px){.cards.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a href="#home" aria-label="CAVA LIFE home"><img src="logo.png" alt="CAVA" width="450" height="278"></a>
  <form class="search" role="search" id="sform">
    <label for="q" style="position:absolute;left:-9999px">Search</label>
    <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
  </form>
</header>

<div class="app">
  <section class="pane left" id="left" aria-label="Index">
    <div id="lview" style="display:flex;flex-direction:column;gap:var(--u)"><p class="sm muted">Loading entries…</p></div>
    <nav class="dock" aria-label="Sections">
      <div class="grid4 sm">
        <a class="box" href="#home" data-r="home"><span>Journal</span></a>
        <a class="box" href="#writers" data-r="writers"><span>Writers</span></a>
        <a class="box" href="#about" data-r="about"><span>About</span></a>
        <a class="box" href="https://instagram.com/cava.life"><span>Instagram</span><span>↗</span></a>
      </div>
    </nav>
  </section>
  <section class="pane right" id="right" aria-label="Entry"></section>
</div>

<script>
const ABOUT={
  band:'카바저널: 문화와 자본, 그 연결을 탐구하는 큐레이션 저널',
  first:'창작자의 생태계를 위한 카바 라이프.',
  lede:'2018년부터 동시대 예술과 문화를 소개해 온 카바 라이프가 2026년 9월 카바저널의 새로운 모습으로 다시 시작했습니다.',
  paras:['카바저널은 문화와 자본, 그 연결을 탐구하는 큐레이션 저널입니다.',
    '귀 기울여야 할 의견과 주목해야 할 현상을 다룹니다. 이미 소비된 트렌드를 요약하기보다, 아직 시장화되지 않은 신호와 이름 붙기 전의 흐름을 포착하려 합니다.',
    '카바가 질문을 던지고, 필진이 자기 시선으로 답합니다.'],
  email:'info@ca-va.life', ig:'cava.life'
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const wide=()=>matchMedia('(min-width:900px)').matches;
let P=[],forms=[],active='All',query='',current=0,leftView='';
const L=$('lview'),R=$('right');

const card=e=>`<a class="card" href="#e-${pad(e.n)}" ${e.n===current?'aria-current="true"':''}>
  <h3 class="lg">${esc(e.who)}<br>${esc(e.t)}</h3>
  <div class="meta sm"><span>${pad(e.n)} · ${e.d}</span><span>${e.form}</span></div>
  <img src="${e.thumb}" alt="" loading="lazy"></a>`;
const row=e=>`<li><a href="#e-${pad(e.n)}"><span>${esc(e.who)}</span><span>${esc(e.t)}</span><span class="sm">${e.form}</span></a></li>`;

function home(){
  leftView='home';
  L.innerHTML=`<div class="band"><span>${ABOUT.band}</span></div>
    <div class="grid4 sm" id="filters" role="group" aria-label="Filter by form"></div>
    <div class="grid2 cards" id="cards"></div>`;
  $('filters').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b){active=b.dataset.k;draw();}});
  draw();
}
function draw(){
  if(leftView!=='home') return;
  $('filters').innerHTML=['All',...forms].map(k=>`<button class="box" aria-pressed="${k===active}" data-k="${k}"><span>${k}</span><span>${k==='All'?P.length:P.filter(e=>e.form===k).length}</span></button>`).join('');
  const q=query.toLowerCase();
  const list=P.filter(e=>(active==='All'||e.form===active)&&(!q||[e.who,e.t,e.form].join(' ').toLowerCase().includes(q)));
  $('cards').innerHTML=list.length?list.map(card).join(''):`<p style="grid-column:1/-1">No entry matches. Try a writer's name, or clear the search.</p>`;
}
function writers(){
  leftView='writers';
  const by={}; P.forEach(e=>(by[e.who]=by[e.who]||[]).push(e));
  const names=Object.keys(by).sort((a,b)=>a.localeCompare(b,'ko'));
  L.innerHTML=`<div class="band"><span>Writers</span><span class="sm">${names.length}</span></div>
    <ul class="rows">${names.map(n=>by[n].map(row).join('')).join('')}</ul>`;
}
function about(){
  leftView='about';
  L.innerHTML=`<div class="band"><span>About CAVA LIFE</span></div>
  <section class="about"><p class="lg">${ABOUT.first}</p><p>${ABOUT.lede}</p>${ABOUT.paras.map(p=>`<p>${p}</p>`).join('')}
    <p class="sm muted" style="margin-top:var(--u)">Contact</p>
    <p>Instagram <a href="https://instagram.com/${ABOUT.ig}"><u>@${ABOUT.ig}</u></a><br>Email <a href="mailto:${ABOUT.email}"><u>${ABOUT.email}</u></a></p>
  </section>`;
}
async function entry(n){
  const e=P[n-1]; if(!e) return;
  current=n;
  const prev=P[n-2], next=P[n];
  const same=P.filter(x=>x.who===e.who&&x!==e);
  R.innerHTML=`<article class="entry">
    <a class="band back" href="#home"><span>← All entries</span></a>
    <h1 class="lg">${esc(e.who)}<br>${esc(e.t)}</h1>
    <div class="meta sm"><span>${pad(e.n)} · ${e.d}</span><span>${e.form}</span></div>
    <div class="band"><span>${prev?`<a href="#e-${pad(prev.n)}">← Newer</a>`:''}</span><span>${next?`<a href="#e-${pad(next.n)}">Older →</a>`:''}</span></div>
    ${e.cover?`<img src="${e.cover}" alt="">`:''}
    <div class="body" id="body"><p class="sm muted">Loading…</p></div>
    ${same.length?`<div class="band"><span>More by ${esc(e.who)}</span></div><ul class="rows">${same.map(row).join('')}</ul>`:''}
  </article>`;
  R.scrollTop=0; if(!wide()) window.scrollTo(0,0);
  try{
    const j=await (await fetch('a/'+pad(n)+'.json')).json();
    if(current!==n) return;
    const b=$('body'); b.innerHTML=j.html;
    b.querySelectorAll('p').forEach(x=>{if(!x.textContent.trim()&&!x.querySelector('img'))x.remove();});
    b.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tablewrap';t.replaceWith(w);w.appendChild(t);});
  }catch(err){
    $('body').innerHTML=`<p>This entry's text didn't load. Reload the page, or read it on <a href="${esc(e.src)}">ca-va.life</a>.</p>`;
  }
}
function route(){
  const h=location.hash.slice(1)||'home';
  const m=h.match(/^e-(\d+)$/);
  document.body.classList.toggle('reading',!!m);
  if(m){ entry(+m[1]); if(!leftView) home(); else if(leftView==='home') draw(); }
  else{
    if(h==='writers') writers(); else if(h==='about') about(); else home();
    if(!current) entry(1);
    $('left').scrollTop=0; if(!wide()) window.scrollTo(0,0);
  }
  const on=m?leftView:h;
  document.querySelectorAll('.dock a[data-r]').forEach(a=>a.dataset.r===on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
}
$('q').addEventListener('input',()=>{
  query=$('q').value.trim();
  if(leftView!=='home'||document.body.classList.contains('reading')&&!wide()) location.hash='#home';
  draw();
});
$('sform').addEventListener('submit',e=>e.preventDefault());
window.addEventListener('hashchange',route);

fetch('posts.json').then(r=>r.json()).then(d=>{
  P=d; forms=[...new Set(P.map(e=>e.form))]; route();
}).catch(()=>{L.innerHTML='<p>The entry list did not load. Reload the page to try again.</p>';});
</script>
</body>
</html>
