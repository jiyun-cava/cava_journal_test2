<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAVA LIFE Journal Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-width white page split in two panes (index left, entry right) on one 12px grid.
   Three text sizes only. Green appears on bands and on whatever is hovered or selected. Single light theme by choice. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --muted:#6f6f6f;
  --hi:#f0ff00;
  --glass:rgba(255,255,255,.72);
  --u:12px;            /* the one spacing unit: gutters, gaps, padding */
  --row:32px;          /* height shared by bands and boxes */
  --lg:clamp(20px,1.6vw,24px);
  --md:17px;
  --sm:12px;
  --font:Futura,"Futura PT","Futura Std",Jost,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--md);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;text-transform:inherit;letter-spacing:inherit}
h1,h2,h3,p{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.sm{font-size:var(--sm);letter-spacing:.06em;text-transform:uppercase;line-height:1.3;font-variant-numeric:tabular-nums}
.lg{font-size:var(--lg);line-height:1.15;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}
.who{font-weight:300}
.meta{display:flex;gap:1.5em;align-items:center}
.meta .r{margin-left:auto}

/* header: logo and search float at the top, no bar */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--u);padding:var(--u)}
.top a{display:block;width:clamp(64px,7vw,96px);aspect-ratio:450/278}
.top img{width:92%;height:auto}
.search{width:clamp(140px,20vw,260px)}
.search input{width:100%;border:0;border-bottom:1px solid var(--ink);border-radius:0;outline:0;background:transparent;font:inherit;font-size:14px;line-height:1.4;color:var(--ink);padding:6px 0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink);opacity:1}
.search input::-webkit-search-decoration,.search input::-webkit-search-cancel-button{-webkit-appearance:none}

/* entrance: only the logo, centered; clicking it opens the site */
#intro{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;width:100%;cursor:pointer}
#intro img{width:min(60vw,520px);height:auto}
#intro[hidden]{display:none}
.app{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.pane{overflow-y:auto;padding:0 var(--u) var(--u);display:flex;flex-direction:column;gap:var(--u);min-width:0}
.pane.left{padding-bottom:0}

/* band and box share one height */
.band{display:flex;align-items:center;justify-content:space-between;gap:var(--u);min-height:var(--row);padding:4px 8px;background:var(--hi);flex:none}
.box{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--row);padding:4px 8px;border:1px solid var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);width:100%;transition:background-color .12s}
.box:hover,.box[aria-pressed="true"],.box[aria-current="page"]{background:var(--hi)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--u)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--u)}

.card{border:1px solid var(--ink);padding:var(--u);display:flex;flex-direction:column;gap:var(--u);transition:background-color .12s;min-width:0}
.card:hover,.card[aria-current="true"]{background:var(--hi)}

.card img{width:100%;aspect-ratio:4/3;object-fit:cover;margin-top:auto}
/* every card reserves three title lines (name + two), so the picture sits at the same height whatever shares its row */
.card h3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:calc(3*1.15em)}

.rows{list-style:none;margin:0;padding:0;display:grid;gap:var(--u)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:var(--u);align-items:baseline;border:1px solid var(--ink);padding:6px 8px;min-height:var(--row);transition:background-color .12s}
.rows a:hover{background:var(--hi)}
.wlist a{grid-template-columns:minmax(96px,200px) minmax(0,1fr)}
.wlist a:hover,.wlist a:focus-visible{background:var(--hc,var(--hi))}
.wlist .quote{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bottom nav: boxes float over the index, no bar behind them */
.dock{position:sticky;bottom:0;padding:var(--u) 0;margin-top:auto;z-index:5;display:grid;gap:var(--u)}
.grid4[hidden]{display:none}
/* nav row has five boxes since SHOP was added */
.dock #navrow{grid-template-columns:repeat(5,minmax(0,1fr))}
/* SHOP: the word drifts right to left without stopping, one copy entering as the other leaves */
.marq{overflow:hidden;justify-content:flex-start;padding:0}
.mq{display:flex;width:200%;animation:mq 7s linear infinite}
.mq span{width:50%;padding:4px 8px;white-space:nowrap}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq{animation:none}}
/* shop cards: same as article cards at rest (stroke, no fill); on hover or when open they turn black with
   white text instead of the key color, and the shirt swaps to its second photo */
.pcard:hover,.pcard:focus-visible,.pcard[aria-current="true"]{background:var(--ink);color:var(--paper)}
.pimg{position:relative;margin-top:auto}
.pimg img{margin:0}
.pimg .alt{position:absolute;inset:0;opacity:0;transition:opacity .12s}
.pcard:hover .pimg .alt,.pcard:focus-visible .pimg .alt{opacity:1}
.pcard .cta{border-bottom:1px solid currentColor}
/* product page */
.product .shot{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.opts{display:grid;gap:var(--u)}
.opt{display:grid;gap:6px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.optrow .box{width:auto;min-width:64px;justify-content:center}
.qty{display:flex;align-items:stretch}
.qty button,.qty output{min-width:var(--row);min-height:var(--row);display:flex;align-items:center;justify-content:center;border:1px solid var(--ink);margin-left:-1px}
.qty button:first-child{margin-left:0}
.qty button:hover{background:var(--hi)}
.buy{justify-content:center;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.buy:hover{background:var(--hi);color:var(--ink)}
.note{font-size:var(--sm);line-height:1.5}
.box[aria-expanded="true"]{background:var(--hi)}

/* entry */
.entry{display:flex;flex-direction:column;gap:var(--u);max-width:760px}
.entry .meta{flex-wrap:wrap}
.entry .meta .chips{margin-left:auto}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;min-height:24px;padding:4px 8px;background:var(--hi)}
.chip:hover{outline:1px solid var(--ink);outline-offset:-1px}
.chip.plain{background:none}
.chip.plain:hover{background:var(--hi);outline:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--u)}
.rule{border:0;border-top:1px solid var(--ink);margin:var(--u) 0 0;width:100%}
.body{font-size:calc(var(--md)*.9);line-height:1.62;overflow-wrap:anywhere}
.body p{margin:0 0 1.1em}
.body img{margin:var(--u) 0;height:auto}
.body h3,.body h4,.body h6{font-size:var(--md);font-weight:500;margin:1.8em 0 .5em}
.body blockquote{margin:1.1em 0;padding-left:var(--u);border-left:3px solid var(--hi)}
.body a{text-decoration:underline;text-underline-offset:3px}
.body a:hover{background:var(--hi)}
.body figure{margin:var(--u) 0}
.body figcaption,.body .cap{font-size:var(--sm);font-weight:400;line-height:1.5;margin:6px 0 1.4em}
.body figure img{margin-bottom:0}
.body hr{border:0;border-top:1px solid var(--ink);margin:1.8em 0}
.tablewrap{overflow-x:auto}
.body table{border-collapse:collapse}
.body td{border:1px solid var(--ink);padding:6px 8px;vertical-align:top}
.stage{display:none}
/* entry closed: the index takes the whole window */
body.closed .app{grid-template-columns:1fr}
body.closed .right{display:none}
/* the full index has exactly twice the columns of the split index, and the inner gutters are halved,
   so a card is the same width in both states and the left columns do not move when an entry opens */
@media (min-width:900px){
  body.closed .left .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  body:not(.closed) .pane.left{padding-right:calc(var(--u)/2)}
  body:not(.closed) .pane.right{padding-left:calc(var(--u)/2)}
}
@media (min-width:1800px){
  .app .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  body.closed .left .cards{grid-template-columns:repeat(6,minmax(0,1fr))}
}
/* split view: the index narrows to one column so text and image each get a third of the window */
body.split .app{grid-template-columns:1fr 2fr}
body.split .cards,body.split .dock .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
body.split .left .cards{grid-template-columns:1fr}
.v2,.v3{max-width:none}
.v2 .reader{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--u);align-items:start}
.v2 .stage{display:flex;align-items:center;position:sticky;top:0;height:var(--ph,80vh);overflow:clip}
.pin{display:grid;gap:var(--u);width:100%;will-change:transform}
.pin figure{margin:0;min-width:0}
.pin img{width:100%;height:auto;max-height:calc(var(--ph,600px) - 120px);object-fit:contain;object-position:left center}
.pin.multi img{max-height:none}
/* writer box at the end of an entry, and the writer panel that takes the image column */
.wbox{width:auto;min-width:180px;align-self:flex-start;background:var(--paper)}
.wbox:hover,.wbox[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.sig{width:150px;height:auto;align-self:flex-start}
.wpanel{display:grid;gap:var(--u);align-content:start;width:100%}
.wpanel .rows a{grid-template-columns:auto minmax(0,1fr) auto}

.pin figcaption{font-size:var(--sm);line-height:1.5;margin-top:6px}
.v2 .body figcaption,.v2 .body .cap,.v3 .body figcaption,.v3 .body .cap,.v4 .body figcaption,.v4 .body .cap{display:none}
.v2 .body img{height:0;margin:0;visibility:hidden}
.v2 .cover,.v3 .cover,.v4 .cover,.v3 .body img,.v4 .body img,.v3 .body figure,.v4 .body figure{display:none}
.v3 .body{font-size:var(--lg);line-height:1.5;max-width:26em;margin:0 auto;text-align:center}
.about{display:grid;gap:var(--u);max-width:62ch}
.about a:hover{background:var(--hi)}
.back{display:none}

@media (max-width:899px){
  html,body{height:auto}
  body{display:block}
  .app{display:block}
  .pane{overflow:visible}
  body.reading .left,body:not(.reading) .right{display:none}
  .back{display:inline-flex;margin-right:auto}
  .entry .meta .chips{width:100%;margin-left:0}
  .dock{position:fixed;left:var(--u);right:var(--u);bottom:0}
  .pane.left{padding-bottom:72px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dock .grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dock #navrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dock #panel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rows a{grid-template-columns:1fr auto}
  .rows a span:first-child{grid-column:1/-1}
}
@media (max-width:520px){.cards.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button id="intro" aria-label="Enter CAVA LIFE" hidden><img src="logo_big.gif" alt="CAVA" width="584" height="364"></button>
<header class="top">
  <a href="#home" id="logo" aria-label="CAVA LIFE home"><img src="logo.gif" alt="CAVA" width="287" height="177"></a>
  <form class="search" role="search" id="sform">
    <label for="q" style="position:absolute;left:-9999px">Search</label>
    <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
  </form>
</header>

<div class="app">
  <section class="pane left" id="left" aria-label="Index">
    <div id="lview" style="display:flex;flex-direction:column;gap:var(--u)"><p class="sm muted">Loading entries…</p></div>
    <nav class="dock" aria-label="Sections">
      <div class="grid4 sm" id="panel" hidden></div>
      <div class="grid4 sm" id="navrow">
        <button class="box" id="t-forms" data-p="forms" aria-expanded="false" aria-controls="panel"><span>Journal</span><span>+</span></button>
        <button class="box" id="t-sort" data-p="sort" aria-expanded="false" aria-controls="panel"><span>Sorting</span><span>+</span></button>
        <a class="box" href="#writers" data-r="writers"><span>Writers</span></a>
        <a class="box marq" href="#shop" data-r="shop" aria-label="Shop"><span class="mq" aria-hidden="true"><span>Shop</span><span>Shop</span></span></a>
        <a class="box" href="#about" data-r="about"><span>About</span></a>
      </div>
    </nav>
  </section>
  <section class="pane right" id="right" aria-label="Entry"></section>
</div>

<script>
const ABOUT={
  band:'카바저널: 문화와 자본, 그 연결을 탐구하는 큐레이션 저널',
  first:'창작자의 생태계를 위한 카바 라이프.',
  lede:'2018년부터 동시대 예술과 문화를 소개해 온 카바 라이프가 2026년 9월 카바저널의 새로운 모습으로 다시 시작했습니다.',
  paras:['카바저널은 문화와 자본, 그 연결을 탐구하는 큐레이션 저널입니다.',
    '귀 기울여야 할 의견과 주목해야 할 현상을 다룹니다. 이미 소비된 트렌드를 요약하기보다, 아직 시장화되지 않은 신호와 이름 붙기 전의 흐름을 포착하려 합니다.',
    '카바가 질문을 던지고, 필진이 자기 시선으로 답합니다.'],
  email:'info@ca-va.life', ig:'cava.life'
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const wide=()=>matchMedia('(min-width:900px)').matches;
let P=[],forms=[],active='All',query='',current=0,leftView='',panel='',sort='Newest',shuffled=[];
const SORTS=['Newest','Oldest','가나다','Shuffle'];
const L=$('lview'),R=$('right');

const card=e=>`<a class="card" href="#e-${pad(e.n)}" ${e.n===current?'aria-current="true"':''}>
  <h3 class="lg"><span class="who">${esc(e.who)}</span><br>${esc(e.t)}</h3>
  <div class="meta sm"><span>No.${e.no}</span><span>${e.d.replace(/\./g,'')}</span><span class="r">${e.form}</span></div>
  <img src="${e.thumb}" alt="" loading="lazy"></a>`;
const row=e=>`<li><a href="#e-${pad(e.n)}"><span>${esc(e.who)}</span><span>${esc(e.t)}</span><span class="sm">${e.form}</span></a></li>`;

function home(){
  leftView='home';
  L.innerHTML=`<div class="grid2 cards" id="cards"></div>`;
  draw();
}
function draw(){
  if(leftView!=='home') return;
  const q=query.toLowerCase();
  let base=P;
  if(sort==='Oldest') base=[...P].reverse();
  else if(sort==='가나다') base=[...P].sort((a,b)=>a.who.localeCompare(b.who,'ko')||a.t.localeCompare(b.t,'ko'));
  else if(sort==='Shuffle') base=shuffled;
  const list=base.filter(e=>(active==='All'||e.form===active)&&(!q||[e.who,e.t,e.form].join(' ').toLowerCase().includes(q)));
  $('cards').innerHTML=list.length?list.map(card).join(''):`<p style="grid-column:1/-1">No entry matches. Try a writer's name, or clear the search.</p>`;
}
function drawPanel(){
  const el=$('panel'); el.hidden=!panel;
  if(panel==='forms') el.innerHTML=['All',...forms].map(k=>`<button class="box" aria-pressed="${k===active}" data-k="${k}"><span>${k}</span><span>${k==='All'?P.length:P.filter(e=>e.form===k).length}</span></button>`).join('');
  if(panel==='sort') el.innerHTML=SORTS.map(k=>`<button class="box" aria-pressed="${k===sort}" data-s="${k}"><span>${k}</span></button>`).join('');
  el.setAttribute('aria-label',panel==='sort'?'Sort entries':'Filter by form');
  document.querySelectorAll('.dock button[data-p]').forEach(b=>{const on=b.dataset.p===panel;b.setAttribute('aria-expanded',on);b.lastElementChild.textContent=on?'×':'+';});
}
document.querySelectorAll('.dock button[data-p]').forEach(b=>b.addEventListener('click',()=>{
  const away=leftView!=='home'||document.body.classList.contains('reading')&&!wide();
  panel=(!away&&panel===b.dataset.p)?'':b.dataset.p;
  if(away) location.hash='#home';
  drawPanel();
}));
$('panel').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.k) active=b.dataset.k;
  if(b.dataset.s){ sort=b.dataset.s; if(sort==='Shuffle'){ shuffled=[...P]; for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];} } }
  draw(); drawPanel(); $('left').scrollTop=0;
});
/* hover color runs from the key yellow at the top of the list to green at the bottom */
const mix=t=>{const a=[0xf0,0xff,0x00], b=[0x39,0xff,0x14]; return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';};
function writers(){
  leftView='writers';
  const by={}; P.forEach(e=>(by[e.who]=by[e.who]||[]).push(e));
  const names=Object.keys(by).sort((a,b)=>a.localeCompare(b,'ko'));
  L.innerHTML=`<ul class="rows wlist">${names.map((n,i)=>`<li><a href="#w-${pad(by[n][0].n)}" data-w="${esc(n)}" style="--hc:${mix(i/Math.max(1,names.length-1))}"><span>${esc(n)}</span><span class="quote"></span></a></li>`).join('')}</ul>`;
  /* hovering a name shows one random line from that writer's entries */
  L.querySelectorAll('.wlist a').forEach(a=>{
    const show=()=>{const qs=by[a.dataset.w].flatMap(e=>e.q||[]); a.lastElementChild.textContent=qs.length?qs[Math.floor(Math.random()*qs.length)]:'';};
    a.addEventListener('mouseenter',show); a.addEventListener('focus',show);
    const hide=()=>{a.lastElementChild.textContent='';}; a.addEventListener('mouseleave',hide); a.addEventListener('blur',hide);
  });
}
/* shop: two items for now; option lists follow a standard shirt layout (color, size, quantity) */
const PRODUCTS=[
  {n:1,name:'카바저널 자수 셔츠',price:32000,img:'shop/shirt-black.jpg',hover:'shop/shirt-white.jpg',
   colors:[{k:'Black',img:'shop/shirt-black.jpg'},{k:'White',img:'shop/shirt-white.jpg'}],sizes:['S','M','L','XL'],
   desc:['카바저널 로고를 왼쪽 가슴에 자수로 새긴 반팔 티셔츠.','블랙은 CAVA JOURNAL 레터링, 화이트는 오벌 자수입니다.']},
  {n:2,name:'카바저널 토트백',price:28000,img:'shop/tote.jpg',
   colors:[],sizes:[],desc:['CAVA JOURNAL 레터링이 들어간 실버 토트백.']}
];
const won=v=>'₩'+v.toLocaleString('en-US');
let curP=0;
const pcard=p=>`<a class="card pcard" href="#p-${p.n}" ${p.n===curP?'aria-current="true"':''}>
  <h3 class="lg">${esc(p.name)}</h3>
  <div class="meta sm"><span>${won(p.price)}</span><span class="r cta">Add to cart</span></div>
  <div class="pimg"><img src="${p.img}" alt="" loading="lazy">${p.hover?`<img class="alt" src="${p.hover}" alt="" loading="lazy">`:''}</div></a>`;
function shop(){
  leftView='shop';
  L.innerHTML=`<div class="grid2 cards" id="shopcards">${PRODUCTS.map(pcard).join('')}</div>`;
}
function product(n){
  const p=PRODUCTS.find(x=>x.n===n); if(!p) return;
  curP=n; current=0; writerOpen=true; document.body.classList.remove('split');
  const i=PRODUCTS.indexOf(p), prev=PRODUCTS[i-1], next=PRODUCTS[i+1];
  const sel={color:p.colors[0]?.k||'',size:'',qty:1};
  R.innerHTML=`<article class="entry product">
    <div class="head"><h1 class="lg">${esc(p.name)}</h1>
      <span class="chips sm">${prev?`<a class="chip plain" href="#p-${prev.n}" aria-label="Previous item">&lt;</a>`:''}${next?`<a class="chip plain" href="#p-${next.n}" aria-label="Next item">&gt;</a>`:''}<button class="chip plain" id="xbtn" aria-label="Close" title="Close">X</button></span></div>
    <div class="meta sm"><span>${won(p.price)}</span><span class="chips"><a class="chip back" href="#shop">All items</a></span></div>
    <img class="shot" id="shot" src="${p.img}" alt="${esc(p.name)}">
    ${p.desc.map(t=>`<p class="sm">${esc(t)}</p>`).join('')}
    <div class="opts sm">
      ${p.colors.length?`<div class="opt"><span>Color</span><div class="optrow" id="o-color">${p.colors.map(c=>`<button class="box" data-v="${c.k}" aria-pressed="${c.k===sel.color}">${c.k}</button>`).join('')}</div></div>`:''}
      ${p.sizes.length?`<div class="opt"><span>Size</span><div class="optrow" id="o-size">${p.sizes.map(z=>`<button class="box" data-v="${z}" aria-pressed="false">${z}</button>`).join('')}</div></div>`:''}
      <div class="opt"><span>Quantity</span><div class="qty"><button id="q-dn" aria-label="One fewer">−</button><output id="q-n">1</output><button id="q-up" aria-label="One more">+</button></div></div>
      <button class="box buy" id="buy">Add to cart · ${won(p.price)}</button>
      <p class="note" id="buynote" aria-live="polite"></p>
    </div>
    <hr class="rule">
    <p class="sm">More merch</p>
    <div class="grid2 cards">${PRODUCTS.filter(x=>x!==p).map(pcard).join('')}</div>
  </article>`;
  const pick=(id,key,after)=>{const row=$(id); if(!row) return; row.addEventListener('click',ev=>{const b=ev.target.closest('button'); if(!b) return;
    sel[key]=b.dataset.v; row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); $('buynote').textContent=''; after&&after();});};
  pick('o-color','color',()=>{$('shot').src=p.colors.find(c=>c.k===sel.color).img;});
  pick('o-size','size');
  const setQ=d=>{sel.qty=Math.max(1,Math.min(20,sel.qty+d)); $('q-n').textContent=sel.qty; $('buy').textContent='Add to cart · '+won(p.price*sel.qty);};
  $('q-dn').addEventListener('click',()=>setQ(-1)); $('q-up').addEventListener('click',()=>setQ(1));
  $('buy').addEventListener('click',()=>{
    if(p.sizes.length&&!sel.size){ $('buynote').textContent='Choose a size first.'; return; }
    $('buynote').textContent=`Added: ${p.name}${sel.color?' / '+sel.color:''}${sel.size?' / '+sel.size:''} × ${sel.qty}`;
  });
  $('xbtn').addEventListener('click',closeEntry);
  R.scrollTop=0; if(!wide()) window.scrollTo(0,0);
  if(leftView==='shop') L.querySelectorAll('.pcard').forEach(a=>a.getAttribute('href')==='#p-'+n?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));
}
function about(){
  leftView='about';
  L.innerHTML=`<section class="about">${ABOUT.paras.map(p=>`<p>${p}</p>`).join('')}
    <p class="sm" style="margin-top:var(--u)"><a href="https://instagram.com/${ABOUT.ig}"><u>Instagram</u></a><br><a href="mailto:${ABOUT.email}"><u>Contact</u></a></p>
  </section>`;
}
async function entry(n){
  const e=P[n-1]; if(!e) return;
  current=n;
  const prev=P[n-2], next=P[n];
    let rel=P.filter(x=>x.form===e.form&&x!==e).slice(0,4), label=MORE[e.form];
  if(!rel.length){ rel=P.filter(x=>x!==e).slice(0,4); label='entries'; }
  R.innerHTML=`<article class="entry">
    <div class="head"><h1 class="lg"><span class="who">${esc(e.who)}</span><br>${esc(e.t)}</h1>
      <span class="chips sm">${prev?`<a class="chip plain" href="#e-${pad(prev.n)}" aria-label="Newer entry">&lt;</a>`:''}${next?`<a class="chip plain" href="#e-${pad(next.n)}" aria-label="Older entry">&gt;</a>`:''}<button class="chip plain" id="xbtn" aria-label="Close entry" title="Close entry">X</button></span></div>
    <div class="meta sm"><span>No.${e.no}</span><span>${e.d.replace(/\./g,'')}</span><span>${e.form}</span>
      <span class="chips"><a class="chip back" href="#home">All entries</a><button class="chip" id="vbtn" title="Change how this entry is laid out"></button></span></div>
    ${e.cover?`<img class="cover" src="${e.cover}" alt="">`:''}
    <div class="reader"><div class="body" id="body"><p class="sm muted">Loading…</p></div>
      <div class="stage" id="stage"></div></div>
    <img class="sig" src="${SIG}" alt="Signature (placeholder)">
    <a class="box wbox sm" href="#w-${pad(e.n)}"><span>${esc(e.who)}</span><span>+</span></a>
    <hr class="rule">
    <p class="sm">Read more ${label}</p>
    <div class="grid2 cards">${rel.map(card).join('')}</div>
  </article>`;
  writerOpen=false;
  $('vbtn').addEventListener('click',()=>{view=view%4+1;applyView();});
  $('xbtn').addEventListener('click',closeEntry);
  applyView();
  R.scrollTop=0; if(!wide()) window.scrollTo(0,0);
  try{
    const j=await (await fetch('a/'+(e.f||pad(n))+'.json')   /* file key stays fixed when newer entries push the list down */).json();
    if(current!==n) return;
    const b=$('body'); b.innerHTML=j.html;
    b.querySelectorAll('p').forEach(x=>{if(!x.textContent.trim()&&!x.querySelector('img'))x.remove();});
    b.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tablewrap';t.replaceWith(w);w.appendChild(t);});
    buildStage();
  }catch(err){
    $('body').innerHTML=`<p>This entry's text didn't load. Reload the page, or read it on <a href="${esc(e.src)}">ca-va.life</a>.</p>`;
  }
}
/* entry views: 01 images inline, 02 text left with the current image pinned right, 03 large centered text, 04 text only */
let view=1, writerOpen=false, closed=true;   /* the site opens on the full index; the right pane appears when an entry is opened */
function closeEntry(){
  closed=true; current=0; writerOpen=false; R.innerHTML='';
  document.body.classList.remove('split');
  const back='#'+(leftView&&leftView!=='home'?leftView:'home');   /* return to whichever list is open on the left */
  if(location.hash===back||(back==='#home'&&!location.hash)) route(); else location.hash=back;
}
const SIG='sig/jungwooyoung.png';   /* placeholder: one signature shown on every entry until each writer has their own */
/* writer page: replaces the open entry in the right pane */
function writer(n){
  const e=P[n-1]; if(!e) return;
  const list=P.filter(x=>x.who===e.who), src=list.find(x=>x.bio)||e, ig=(list.find(x=>x.ig)||e).ig;
  writerOpen=true; document.body.classList.remove('split');
  R.innerHTML=`<article class="entry writer">
    <div class="head"><h1 class="lg">${esc(e.who)}</h1>
      <span class="chips sm"><a class="chip plain" href="#e-${pad(e.n)}" aria-label="Back to the entry" title="Back to the entry">&lt;</a><button class="chip plain" id="xbtn" aria-label="Close" title="Close">X</button></span></div>
    <div class="meta sm"><span class="chips"><a class="chip back" href="#home">All entries</a></span></div>
    ${src.bio?`<p>${esc(src.bio)}</p>`:''}
    ${ig?`<p class="sm"><a href="https://www.instagram.com/${ig}/"><u>Instagram @${ig}</u></a></p>`:''}
    <hr class="rule">
    <p class="sm">Written by ${esc(e.who)}</p>
    <div class="grid2 cards">${list.map(card).join('')}</div>
  </article>`;
  $('xbtn').addEventListener('click',closeEntry);
  R.scrollTop=0; if(!wide()) window.scrollTo(0,0);
}
const VIEWS=['Inline','Split','Large text','Text only'];
const MORE={'Essay':'essays','Diary':'diaries','Field notes':'field notes','Critique':'critiques','Travelogue':'travelogues','Backstory':'backstories','Letter':'letters'};
function applyView(){
  const a=R.querySelector('.entry'); if(!a) return;
  const eff=(view===2&&!wide())?1:view;
  document.body.classList.toggle('split',eff===2);
  a.classList.remove('v1','v2','v3','v4'); a.classList.add('v'+eff);
  $('vbtn').textContent='View '+pad(view)+' · '+VIEWS[view-1];
  layoutStage();
}
/* split view: each image is pinned at the top of the right column from the moment its text block arrives
   (it appears at once), then scrolls up and away as the next block takes over. Captions sit under their image. */
const capOf=m=>{const blk=m.closest('figure')||m.closest('p')||m; if(blk.tagName==='FIGURE') return blk.querySelector('figcaption');
  const n=blk.nextElementSibling; return n&&n.tagName==='H6'?n:null;};
function buildStage(){
  const st=$('stage'), b=$('body'); if(!st||!b) return;
  b.querySelectorAll('img').forEach(m=>{const c=capOf(m); if(c&&c.tagName==='H6') c.classList.add('cap');});
  layoutStage();
}
let groups=[],shown=-1;
const MIN_GAP=320, EXIT=220;   /* images closer than MIN_GAP share the stage; an image drifts up over its last EXIT px */
function layoutStage(){
  const st=$('stage'), b=$('body'); if(!st||!b||writerOpen||!R.querySelector('.entry.v2')) return;
  const top=b.getBoundingClientRect().top;
  st.style.setProperty('--ph',R.clientHeight+'px');
  groups=[{y:-1e6,items:[]}];
  if(P[current-1].cover) groups[0].items.push({src:P[current-1].cover,cap:''});
  b.querySelectorAll('img').forEach(m=>{
    const y=m.getBoundingClientRect().top-top, c=capOf(m), it={src:m.getAttribute('src'),cap:c?c.textContent.trim():''};
    const g=groups[groups.length-1];
    if(!g.items.length) g.items.push(it);
    else if(groups.length>1&&g.items.length<4&&y-g.y<MIN_GAP) g.items.push(it);
    else groups.push({y,items:[it]});
  });
  groups.forEach(g=>g.items.forEach(x=>{const i=new Image();i.src=x.src;}));   /* preload so each swap is instant */
  shown=-1; showPins();
}
function showPins(){
  const st=$('stage'), b=$('body'); if(!st||!b||writerOpen||!groups.length||!R.querySelector('.entry.v2')) return;
  const r=R.getBoundingClientRect(), line=r.top+r.height*.5-b.getBoundingClientRect().top;   /* middle of the pane, in body coordinates */
  let cur=0; groups.forEach((g,i)=>{if(g.y<=line) cur=i;});
  if(cur!==shown){
    const g=groups[cur]; shown=cur;
    st.innerHTML=`<div class="pin${g.items.length>1?' multi':''}">${g.items.map(x=>`<figure><img src="${x.src}" alt="">${x.cap?`<figcaption>${esc(x.cap)}</figcaption>`:''}</figure>`).join('')}</div>`;
    st.querySelectorAll('img').forEach(i=>i.addEventListener('load',showPins));
  }
  const next=groups[cur+1], pin=st.firstElementChild;
  let shift=0, ex=0;
  const startY=cur?groups[cur].y:r.height*.5;
  if(next){ const span=next.y-Math.max(groups[cur].y,-EXIT*4); ex=Math.min(EXIT,span*.4); const d=next.y-line; if(d<ex) shift=-(ex-d); }
  /* a stack taller than the pane pans from its top to its bottom while its section is read */
  const H=pin?pin.offsetHeight:0, tall=H>r.height-8;
  st.style.alignItems=tall?'flex-start':'center';
  if(tall){ const end=(next?next.y-ex:b.offsetHeight), p=Math.min(1,Math.max(0,(line-startY)/Math.max(1,end-startY))); shift-=(H-r.height+12)*p; }
  if(pin) pin.style.transform=shift?`translateY(${shift}px)`:'';
}
R.addEventListener('scroll',showPins,{passive:true});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>layoutStage());
window.addEventListener('resize',applyView);
function route(){
  const h=location.hash.slice(1)||'home';
  const w=h.match(/^w-(\d+)$/), pm=h.match(/^p-(\d+)$/);
  const m=h.match(/^e-(\d+)$/)||w||pm;
  if(!pm) curP=0;
  if(m) closed=false;
  document.body.classList.toggle('reading',!!m);
  document.body.classList.toggle('closed',closed);
  if(pm){ if(leftView!=='shop') shop(); product(+pm[1]); keepAnchor(); }
  else if(w){ writer(+w[1]); if(!leftView) home(); }
  else if(m){ entry(+m[1]); if(!leftView) home(); else if(leftView==='home') draw(); keepAnchor(); }
  else{
    if(h==='writers') writers(); else if(h==='about') about(); else if(h==='shop') shop(); else home();
    draw();
    $('left').scrollTop=0; if(!wide()) window.scrollTo(0,0);
  }
  const on=m?leftView:h;
  document.querySelectorAll('.dock a[data-r]').forEach(a=>a.dataset.r===on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(on!=='home'&&panel){ panel=''; drawPanel(); }
}
$('q').addEventListener('input',()=>{
  query=$('q').value.trim();
  if(leftView!=='home'||document.body.classList.contains('reading')&&!wide()) location.hash='#home';
  draw();
});
$('sform').addEventListener('submit',e=>e.preventDefault());
/* the logo always returns to the main home: the full index grid, filters cleared */
$('logo').addEventListener('click',ev=>{
  ev.preventDefault();
  closed=true; current=0; writerOpen=false; R.innerHTML=''; document.body.classList.remove('split');
  active='All'; sort='Newest'; query=''; $('q').value=''; panel=''; drawPanel();
  if(location.hash==='#home') route(); else location.hash='#home';
});
/* show the entrance only when arriving at the site itself, not on a link straight to an entry or page */
if(!location.hash){ $('intro').hidden=false; $('intro').focus(); }
$('intro').addEventListener('click',()=>{ $('intro').hidden=true; });
let anchor=null;
$('left').addEventListener('click',ev=>{const c=ev.target.closest('.card'); if(c) anchor={href:c.getAttribute('href'),top:c.getBoundingClientRect().top};});
function keepAnchor(){
  if(!anchor||!wide()) return; const c=L.querySelector(`.card[href="${anchor.href}"]`);
  if(c) $('left').scrollTop+=c.getBoundingClientRect().top-anchor.top;
  anchor=null;
}
window.addEventListener('hashchange',route);

fetch('posts.json').then(r=>r.json()).then(d=>{
  P=d; forms=[...new Set(P.map(e=>e.form))]; route();
}).catch(()=>{L.innerHTML='<p>The entry list did not load. Reload the page to try again.</p>';});
</script>
</body>
</html>
